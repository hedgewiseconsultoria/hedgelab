name: Coleta diária de boletins oficiais B3

# Roda fora do caminho de requisição do usuário do HEDGE LAB, com timeout generoso.
# Baixa os pacotes ZIP públicos e OFICIAIS da B3 (sem transformação) e os commita em
# b3-snapshots/. O servidor lê esses arquivos via API do GitHub antes de tentar um
# download ao vivo — ver server/ingestion/b3SnapshotCache.ts.
on:
  schedule:
    # 21:30 UTC ≈ 18:30 America/Sao_Paulo (horário padrão), após o processamento diário da B3.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: b3-daily-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Habilitar corepack/pnpm
        # A versão de corepack empacotada com Node 22.13 não reconhece as chaves de assinatura
        # mais recentes do registro do npm ("Cannot find matching keyid"), o que quebra a
        # instalação do pnpm em runners do GitHub Actions. Atualizar o corepack antes de
        # habilitá-lo resolve — não é um problema deste projeto, é uma incompatibilidade
        # conhecida entre versões antigas do corepack e o registro do npm.
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Coletar boletins oficiais da B3
        run: npx tsx scripts/collect-b3-daily-snapshot.mjs

      - name: Gerar índice compacto de contratos B3
        run: |
          set -euo pipefail
          for snapshot_date in $(find b3-snapshots -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$' | sort); do
            if test -f "b3-snapshots/${snapshot_date}/BVBG.086.01/PR${snapshot_date:2:2}${snapshot_date:5:2}${snapshot_date:8:2}.zip" && test -f "b3-snapshots/${snapshot_date}/BVBG.028.02/IN${snapshot_date:2:2}${snapshot_date:5:2}${snapshot_date:8:2}.zip"; then
              B3_SNAPSHOT_CACHE_ROOT=. npx tsx scripts/build-b3-catalog-index.ts "${snapshot_date}"
            fi
          done

      - name: Commitar e publicar snapshot atualizado
        run: |
          set -euo pipefail
          git config user.name "hedge-lab-b3-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add b3-snapshots
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no snapshot; nada para commitar."
            exit 0
          fi

          # O branch main pode receber alterações enquanto a coleta B3 está em andamento.
          # O commit local vem antes do rebase para que o Git consiga reaplicar somente os
          # snapshots sobre a versão remota mais recente, sem sobrescrever código do app.
          git commit -m "chore(b3-snapshot): atualiza boletins oficiais B3 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
